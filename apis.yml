aid: brndme
name: BRND.ME
description: 'BRND.ME (legally Mensa Brand Technologies Private Limited) is an India-based
  house-of-brands company that acquires, builds, and scales digital-first consumer
  brands across Health, Wellness, Lifestyle, Fashion, Party & Celebration, and Home
  Decor. Founded by Ananth Narayanan and backed by Accel, the company combines
  technology, data insight, and centralized operations to grow market-leading D2C
  brands from India for global customers. Its portfolio includes brands such as
  Majestic Pure, Botanic Hearth, Dennis Lingo, House of Ishin, and MyFitness. This
  is a company/provider profile in the API Evangelist network; BRND.ME operates a
  corporate marketing presence and does not publish a public developer API.'
